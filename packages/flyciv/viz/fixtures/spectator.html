<!DOCTYPE html>
<html lang="en" data-mode="watch">
<head>
<meta charset="utf-8"/>
<title>FLYCIV</title>
<style>
  :root {
    --bg:#070b14; --panel:#070b14; --ink:#eef3ff; --dim:#8b93a7;
    --line:#1c2436; --hero:#ff7a18; --crowd:#6d7b93; --spike:#3dffd0;
    --road:#ffd36a; --food:#3dff6a; --nest:#3d8bff;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font: 13px/1.35 "IBM Plex Sans", ui-sans-serif, sans-serif; }
  body { display:flex; flex-direction:column; }
  header, footer { flex:0 0 auto; }
  header {
    display:flex; justify-content:space-between; align-items:flex-end;
    padding:10px 16px 8px; gap:16px;
  }
  .word { font: 800 18px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace; letter-spacing:.18em; }
  .word span { color:var(--spike); }
  .quiet { color:var(--dim); font-size:11px; margin-top:4px; }
  #status { font: 800 16px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  #status .off { color:var(--dim); }
  #status .on { color:var(--spike); }
  .stage { flex:1 1 auto; min-height:0; display:grid; grid-template-columns: 1.15fr 0.95fr 210px; }
  .pane { min-width:0; min-height:0; position:relative; }
  .pane h2 { position:absolute; z-index:2; left:12px; top:8px; margin:0;
    font: 700 10px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
  .canvas-wrap { position:absolute; inset:0; }
  canvas { width:100%; height:100%; display:block; }
  #neuroscope { border-left:1px solid var(--line); padding:28px 12px 8px; display:flex; flex-direction:column; gap:8px; }
  #scope { width:100%; height:88px; flex:0 0 88px; background:#0b1020; }
  .bars { display:flex; flex-direction:column; gap:7px; }
  .bar-row { display:grid; grid-template-columns: 64px 1fr; gap:8px; align-items:center;
    font: 700 11px/1 "IBM Plex Mono", ui-monospace, Menlo, monospace; letter-spacing:.04em; color:var(--dim); }
  .bar { height:10px; background:#151b2c; }
  .bar i { display:block; height:100%; width:0; background:var(--spike); }
  .bar-row.hot { color:var(--ink); }
  .bar-row.hot i { background:var(--hero); }
  #titlecard {
    position:absolute; left:24px; bottom:24%; z-index:4; pointer-events:none;
    font: 800 42px/1 "IBM Plex Sans", ui-sans-serif, sans-serif; letter-spacing:-.03em;
    text-shadow: 0 8px 40px #000;
  }
  footer { padding:10px 16px 14px; }
  #ticker { font: 700 18px/1.3 "IBM Plex Mono", ui-monospace, Menlo, monospace; min-height:1.3em; }
  .tools { display:flex; gap:10px; align-items:center; margin-top:8px; color:var(--dim); font-size:12px; }
  button { background:#12182a; color:var(--ink); border:1px solid #2a3550; padding:6px 10px; cursor:pointer; }
  html[data-mode="lab"] {
    --bg:#efe8d8; --panel:#f7f1e4; --ink:#1d1a16; --dim:#5c564c; --line:#cfc4ae;
    --hero:#c45c12; --crowd:#3d4a3a; --spike:#1f7a3a; --road:#6a5433; --food:#2e7d3a; --nest:#1f4f7a;
  }
  html[data-mode="lab"] #titlecard { display:none; }
  html[data-mode="lab"] #ticker { font-size:13px; font-weight:500; }
  html[data-cinema="1"] .tools { display:none; }
  html[data-cinema="1"] .quiet { display:none; }
</style>
</head>
<body>
<header>
  <div>
    <div class="word">FLY<span>CIV</span></div>
    <div class="quiet" id="quiet">tiny MaleCNS · frozen brain · evolving habits</div>
  </div>
  <div id="status">gen 0 · trainer OFF</div>
</header>
<div class="stage">
  <section class="pane" id="p-world">
    <h2>colony</h2>
    <div class="canvas-wrap"><canvas id="world"></canvas></div>
    <div id="titlecard"></div>
  </section>
  <section class="pane" id="p-brain">
    <h2>brain</h2>
    <div class="canvas-wrap"><canvas id="brain"></canvas></div>
  </section>
  <aside class="pane" id="neuroscope">
    <h2>scope</h2>
    <canvas id="scope" width="280" height="88"></canvas>
    <div class="bars" id="bars"></div>
  </aside>
</div>
<footer>
  <div id="ticker"></div>
  <div class="tools">
    <button id="play">pause</button>
    <input id="scrub" type="range" min="0" max="0" value="0" style="flex:1;width:100%">
    <label>speed <input id="speed" type="range" min="1" max="12" value="8"></label>
    <label><input id="loop" type="checkbox"> loop</label>
    <a id="lab-link" href="?lab=1" style="color:inherit">lab</a>
  </div>
</footer>
<script>
const params = new URLSearchParams(location.search);
const MODE = params.has('lab') ? 'lab' : 'watch';
const CINEMA = params.has('cinema');
document.documentElement.dataset.mode = MODE;
if (CINEMA) document.documentElement.dataset.cinema = '1';
if (MODE === 'lab') document.getElementById('lab-link').href = '?';
document.getElementById('lab-link').textContent = MODE === 'lab' ? 'watch' : 'lab';

const DATA = __FRAMES__;
const frames = DATA.frames || [];
const cloud = (DATA.meta && DATA.meta.cloud) || null;
const gens = (DATA.meta && DATA.meta.generations) || 1;
const world = document.getElementById('world');
const brain = document.getElementById('brain');
const scope = document.getElementById('scope');
const wctx = world.getContext('2d');
const bctx = brain.getContext('2d');
const sctx = scope.getContext('2d');
const scrub = document.getElementById('scrub');
const playBtn = document.getElementById('play');
const speed = document.getElementById('speed');
const loopBox = document.getElementById('loop');
let i = 0, playing = true, acc = 0, last = performance.now();
let spikeHist = [];
let lastFrameIndex = -1;
let yaw = 0.95, pitch = 0.42, dragging = false, lx=0, ly=0;
let glowDecay = null;
let flash = 0;
let camZoom = 1, camZoomTo = 1;
let seenTrainer = false, seenChild = false;
let tPlay = 0;
scrub.max = Math.max(0, frames.length - 1);
if (CINEMA) speed.value = 11;

function decU8(b64) {
  const bin = atob(b64);
  const a = new Uint8Array(bin.length);
  for (let k=0;k<bin.length;k++) a[k] = bin.charCodeAt(k);
  return a;
}
function decF32(b64) {
  return new Float32Array(decU8(b64).buffer);
}
const soma = cloud ? decF32(cloud.xyz_b64) : new Float32Array();
const somaN = cloud ? cloud.n : 0;
const somaSC = cloud ? decU8(cloud.sc_b64) : new Uint8Array();

function fit(c) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = c.clientWidth, h = c.clientHeight;
  if (w < 2 || h < 2) return;
  c.width = Math.floor(w * dpr);
  c.height = Math.floor(h * dpr);
  c.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
}
function resize() { fit(world); fit(brain); }
window.addEventListener('resize', () => { resize(); draw(frames[i], true); });
resize();
brain.addEventListener('pointerdown', e => { dragging = true; lx=e.clientX; ly=e.clientY; brain.setPointerCapture(e.pointerId); });
brain.addEventListener('pointerup', () => dragging=false);
brain.addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw += (e.clientX-lx)*0.008;
  pitch = Math.max(-1.2, Math.min(1.2, pitch+(e.clientY-ly)*0.008));
  lx=e.clientX; ly=e.clientY;
});
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen?.();
  if (e.key === ' ') { e.preventDefault(); toggle(); }
});

function contentBox(f) {
  const n=f.res, mask=decU8(f.mask_b64), wear=decU8(f.wear_b64);
  let x0=n,y0=n,x1=0,y1=0;
  const hit=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
  for (let y=0;y<n;y++) for (let x=0;x<n;x++) {
    const p=y*n+x;
    if ((mask[p]||0) || (wear[p]||0)>6) hit(x,y);
  }
  for (const a of f.agents) hit(a.x,a.y);
  hit(f.nest[1], f.nest[0]);
  if (x1<x0) { x0=0;y0=0;x1=n-1;y1=n-1; }
  const pad = Math.max(3, Math.floor((x1-x0)*0.16));
  return {x0:Math.max(0,x0-pad), y0:Math.max(0,y0-pad), x1:Math.min(n-1,x1+pad), y1:Math.min(n-1,y1+pad)};
}

function drawWorld(f) {
  const W=world.clientWidth, H=world.clientHeight;
  const watch = MODE==='watch';
  wctx.fillStyle = watch ? '#070b14' : '#e9e1cd';
  wctx.fillRect(0,0,W,H);
  const n=f.res, wear=decU8(f.wear_b64), mask=decU8(f.mask_b64);
  const box=contentBox(f);
  const bw=box.x1-box.x0+1, bh=box.y1-box.y0+1;
  let s = Math.min(W/(bw+bh), H/((bw+bh)*0.52)) * 0.95;
  s *= camZoom;
  const ox=W/2, oy=H*0.16;
  const iso=(x,y)=>{
    const X=(x-box.x0)-(bw/2), Y=(y-box.y0)-(bh/2);
    return [ox+(X-Y)*s, oy+(bw+bh)*s*0.22 + (X+Y)*s*0.52];
  };
  for (let y=box.y0;y<=box.y1;y++) for (let x=box.x0;x<=box.x1;x++) {
    const p=y*n+x, m=mask[p]||0, wv=wear[p]||0;
    const [px,py]=iso(x,y);
    let col = watch ? '#0c1220' : '#f4ecda';
    if (wv) {
      const t=wv/255;
      col = watch
        ? `rgb(${20+t*180},${16+t*90},${8+t*20})`
        : `rgb(${220-t*90},${200-t*110},${160-t*90})`;
    }
    if (m&2) col = watch ? '#c4922a' : '#b08948';
    if (m&1) col = watch ? '#ffd36a' : '#6a5433';
    wctx.fillStyle=col;
    const thick = m&1 ? 1.15 : (wv>40 ? 1.08 : 1);
    wctx.beginPath();
    wctx.moveTo(px, py);
    wctx.lineTo(px+s*thick, py+s*0.52*thick);
    wctx.lineTo(px, py+s*1.04*thick);
    wctx.lineTo(px-s*thick, py+s*0.52*thick);
    wctx.closePath();
    wctx.fill();
    if (m&4) {
      wctx.fillStyle = watch ? '#3dff6a' : '#2e7d3a';
      wctx.beginPath(); wctx.arc(px, py+s*0.45, Math.max(3, s*0.22),0,7); wctx.fill();
    }
  }
  const [nx,ny]=iso(f.nest[1], f.nest[0]);
  const glow = f.trainer ? (watch?18:10) : 8;
  if (watch) {
    const g = wctx.createRadialGradient(nx, ny+6, 2, nx, ny+6, glow*2.2);
    g.addColorStop(0, f.trainer ? 'rgba(61,139,255,.95)' : 'rgba(61,139,255,.45)');
    g.addColorStop(1, 'rgba(61,139,255,0)');
    wctx.fillStyle=g;
    wctx.beginPath(); wctx.arc(nx, ny+6, glow*2.2, 0, 7); wctx.fill();
  }
  wctx.fillStyle = watch ? (f.trainer?'#7eb6ff':'#3d8bff') : '#1f4f7a';
  wctx.fillRect(nx-s*0.55, ny, s*1.1, s*0.75);
  for (const a of f.agents) {
    const [px,py]=iso(a.x,a.y);
    if (a.k==='c') {
      wctx.fillStyle = watch ? '#6d7b93' : '#3d4a3a';
      wctx.beginPath(); wctx.arc(px, py, watch?4.6:2.4, 0, 7); wctx.fill();
    } else {
      const child = a.k==='C';
      wctx.strokeStyle = watch ? '#ffd36a' : '#1d1a16';
      wctx.lineWidth = child ? 3 : 2;
      wctx.beginPath(); wctx.arc(px, py, watch?9.5:5, 0, 7); wctx.stroke();
      wctx.fillStyle = watch ? '#ff7a18' : '#c45c12';
      wctx.beginPath(); wctx.arc(px, py, watch?7.2:4, 0, 7); wctx.fill();
    }
  }
}

function drawBrain(f, dt) {
  const W=brain.clientWidth, H=brain.clientHeight;
  const watch = MODE==='watch';
  bctx.fillStyle = watch ? '#05070d' : '#e7eef2';
  bctx.fillRect(0,0,W,H);
  if (!somaN) return;
  if (!glowDecay || glowDecay.length !== somaN) glowDecay = new Float32Array(somaN);
  const decay = Math.pow(0.08, (dt||16)/280);
  for (let k=0;k<somaN;k++) glowDecay[k] *= decay;
  const spikes = f.spikes || [];
  if (cloud) {
    for (let t=0;t<spikes.length;t++) if (spikes[t]) {
      for (const h of (cloud.halo[t]||[])) glowDecay[h] = Math.max(glowDecay[h], 0.7);
      const ti = cloud.toy_idx[t];
      if (ti>=0) glowDecay[ti] = 1;
    }
  }
  if (f.ate || (!seenTrainer && f.trainer) || (!seenChild && f.n_child>0)) flash = 1;
  flash *= Math.pow(0.05, (dt||16)/220);
  const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  const sc = Math.min(W,H)*0.5;
  const pts = new Array(somaN);
  for (let k=0;k<somaN;k++) {
    const x=soma[k*3], y=soma[k*3+1], z=soma[k*3+2];
    const x1=x*cy-z*sy, z1=x*sy+z*cy;
    const y1=y*cp-z1*sp, z2=y*sp+z1*cp;
    pts[k]=[W/2+x1*sc, H/2+y1*sc, z2, k];
  }
  pts.sort((a,b)=>a[2]-b[2]);
  for (const p of pts) {
    const g = glowDecay[p[3]];
    if (g>0.05) {
      bctx.fillStyle = watch ? `rgba(61,255,208,${0.35+0.65*g})` : `rgba(31,122,58,${0.4+0.6*g})`;
      const r = 1.2 + g*2.4;
      bctx.fillRect(p[0], p[1], r, r);
    } else {
      bctx.fillStyle = watch ? 'rgba(140,150,170,0.38)' : 'rgba(70,78,86,0.5)';
      bctx.fillRect(p[0], p[1], 1.15, 1.15);
    }
  }
  if (flash > 0.04) {
    bctx.fillStyle = watch ? `rgba(61,255,208,${0.18*flash})` : `rgba(255,255,255,${0.12*flash})`;
    bctx.fillRect(0,0,W,H);
  }
}

function drawScope(f, isNew) {
  const w = scope.clientWidth || 200, h = scope.clientHeight || 88;
  const dpr = Math.min(2, window.devicePixelRatio||1);
  if (scope.width !== Math.floor(w*dpr)) {
    scope.width = Math.floor(w*dpr);
    scope.height = Math.floor(h*dpr);
    sctx.setTransform(dpr,0,0,dpr,0,0);
  }
  sctx.fillStyle = MODE==='watch' ? '#0b1020' : '#fbf7ee';
  sctx.fillRect(0,0,w,h);
  if (isNew) {
    spikeHist.push(f.spikes||[]);
    if (spikeHist.length>80) spikeHist.shift();
  }
  const n = Math.max(1,(f.spikes||[]).length||20);
  const cw=w/80, ch=h/n;
  for (let t=0;t<spikeHist.length;t++) {
    const col=spikeHist[t]||[];
    for (let k=0;k<n;k++) if (col[k]) {
      sctx.fillStyle = MODE==='watch' ? '#3dffd0' : '#1f7a3a';
      sctx.fillRect(t*cw, k*ch+0.4, Math.max(1.4,cw), Math.max(1,ch-0.8));
    }
  }
  const names=f.names||[];
  const rates=f.rates||[];
  const idx=nm=>names.indexOf(nm);
  const rate=nm=> idx(nm)>=0 ? (rates[idx(nm)]||0) : 0;
  const rows = [
    ['sugar', rate('sugar_sensor')],
    ['walk', rate('dn_walk')],
    ['follow', rate('dn_follow')],
    ['reward', rate('ppl1_reward')],
    ['trainer', f.trainer?1:0],
    ['child', f.n_child>0?1:0],
  ];
  const maxr = Math.max(0.2, ...rows.map(r=>r[1]));
  document.getElementById('bars').innerHTML = rows.map(([k,v]) => {
    const pct = Math.min(100, 100*v/maxr);
    const hot = (k==='trainer' && f.trainer) || (k==='child' && f.n_child>0);
    return `<div class="bar-row${hot?' hot':''}"><span>${k}</span><span class="bar"><i style="width:${pct}%"></i></span></div>`;
  }).join('');
}

function shotCopy(f, t01) {
  if (!CINEMA) return '';
  if (t01 < 0.11) return 'gen 0';
  if (t01 < 0.28) return 'trails';
  if (t01 < 0.48) return 'a city';
  if (t01 < 0.68) return 'they built a trainer';
  if (t01 < 0.88) return 'it trains flies';
  return '';
}

function tickerText(f) {
  const ev = f.events||[];
  if (!ev.length) return '';
  const last = ev[ev.length-1];
  const map = {
    first_trail:'first trail', first_store:'first store', first_road:'roads',
    trainer_unlocked:'trainer on', trainer_child:'child born'
  };
  return ev.map(e => map[e.name] || e.name).join('  →  ');
}

function draw(f, redrawOnly, dt) {
  if (!f) return;
  const isNew = !redrawOnly && i !== lastFrameIndex;
  if (isNew) lastFrameIndex = i;
  if (f.trainer && !seenTrainer) { camZoomTo = 1.55; seenTrainer = true; }
  if (f.n_child>0 && !seenChild) { seenChild = true; camZoomTo = 1.7; }
  camZoom += (camZoomTo - camZoom) * 0.08;
  camZoomTo += (1.05 - camZoomTo) * 0.01;
  drawWorld(f);
  drawBrain(f, dt);
  drawScope(f, isNew);
  const tr = f.trainer ? 'trainer ON' : 'trainer OFF';
  document.getElementById('status').innerHTML = `gen ${f.generation} · <span class="${f.trainer?'on':'off'}">${tr}</span>`;
  document.getElementById('ticker').textContent = tickerText(f);
  const t01 = frames.length>1 ? i/(frames.length-1) : 0;
  document.getElementById('titlecard').textContent = shotCopy(f, t01);
  document.getElementById('quiet').textContent = CINEMA && t01>0.88
    ? 'tiny MaleCNS · frozen brain · evolving habits'
    : (MODE==='watch' ? 'tiny MaleCNS · frozen brain · evolving habits' : 'Not a living fly. Frozen connectome; only adapters evolve.');
}

function toggle(){ playing=!playing; playBtn.textContent = playing?'pause':'play'; }
playBtn.onclick = toggle;
scrub.oninput = () => { i=+scrub.value; spikeHist=[]; lastFrameIndex=-1; glowDecay=null; draw(frames[i], false, 16); };

function cinemaMs() {
  // 12.5s for the whole reel when cinema=1
  return CINEMA ? (12500 / Math.max(1, frames.length)) : (180 / (0.4 + +speed.value));
}
function tick(now) {
  const dt=now-last; last=now;
  if (!dragging) yaw += dt*0.00016;
  if (playing && frames.length) {
    acc += dt;
    const ms = cinemaMs();
    while (acc >= ms) {
      acc -= ms;
      if (i >= frames.length-1) {
        if (loopBox.checked || (CINEMA && false)) { i=0; spikeHist=[]; lastFrameIndex=-1; seenTrainer=false; seenChild=false; camZoom=1; camZoomTo=1; }
        else { playing=false; playBtn.textContent='play'; break; }
      } else i += 1;
      scrub.value=i;
    }
  }
  draw(frames[i], i===lastFrameIndex, dt);
  requestAnimationFrame(tick);
}
draw(frames[0], false, 16);
requestAnimationFrame(tick);
</script>
</body>
</html>
